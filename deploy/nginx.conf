# Copy file này vào /etc/nginx/sites-available/miraway trên server
# rồi: sudo ln -s /etc/nginx/sites-available/miraway /etc/nginx/sites-enabled/
# Sửa server_name và root cho đúng với DEPLOY_PATH.

server {
    listen 80;
    server_name example.com www.example.com;

    root /var/www/miraway/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
